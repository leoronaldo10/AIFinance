name: Read retry-002 public results
on:
  workflow_dispatch:
    inputs:
      identity_preflight:
        description: GitHub identity check only; no Alibaba or ECS access
        type: boolean
        required: true
        default: true
permissions: {}
concurrency:
  group: read-retry002-public-results
  cancel-in-progress: false
jobs:
  read:
    if: >-
      github.repository == 'leoronaldo10/AIFinance' &&
      github.repository_id == '1396876434' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: leoronaldo10/AIFinance/.github/workflows/read-results-reusable.yml@d6046e9c7f5181b3995e9f86de20002c3d83d4a6
    with:
      identity_preflight: ${{ inputs.identity_preflight }}
      expected_reusable_sha: d6046e9c7f5181b3995e9f86de20002c3d83d4a6
